<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Адресный склад запчастей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: yard-terminal plan (SVG floor map) on the left, operator panel on the right; stacks on phones */
:root{
  --bg:#E9ECEC; --surface:#F7F8F8; --surface2:#EEF1F1; --ink:#1A2227; --muted:#5A666D; --line:#D0D6D8;
  --accent:#F2B705; --accent-ink:#1A2227; --floor:#F2F4F3; --mark:#C99A06;
  --f0:#DCE1E3; --f1:#B7D0D7; --f2:#7DAFBE; --f3:#3E7E95; --f4:#1C4C61;
  --ok:#2E7D4F; --warn:#B5651D; --bad:#C2412D;
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161A; --surface:#182026; --surface2:#1E272E; --ink:#E3E8EA; --muted:#8E9AA1; --line:#2B353C;
  --accent:#F5C02B; --accent-ink:#11161A; --floor:#141B20; --mark:#8C6E14;
  --f0:#222B31; --f1:#22404B; --f2:#2E6375; --f3:#4F93AB; --f4:#8CC7DA;
  --ok:#5DBB84; --warn:#E39A52; --bad:#EE7461; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161A; --surface:#182026; --surface2:#1E272E; --ink:#E3E8EA; --muted:#8E9AA1; --line:#2B353C;
  --accent:#F5C02B; --accent-ink:#11161A; --floor:#141B20; --mark:#8C6E14;
  --f0:#222B31; --f1:#22404B; --f2:#2E6375; --f3:#4F93AB; --f4:#8CC7DA;
  --ok:#5DBB84; --warn:#E39A52; --bad:#EE7461; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);padding-inline:16px;padding-block:14px 24px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.kpis{display:flex;flex-wrap:wrap;gap:6px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:96px}
.kpi b{display:block;font:600 17px var(--font-mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.maphead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.maphead h2{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
svg.map{width:100%;height:auto;display:block}
.floor{fill:var(--floor)}
.zoneframe{fill:none;stroke:var(--mark);stroke-width:1.2;stroke-dasharray:6 4}
.zlabel{fill:var(--ink);font:600 12px var(--font-ui)}
.zsub{fill:var(--muted);font:400 10px var(--font-ui)}
.rowlbl{fill:var(--muted);font:400 8px var(--font-mono)}
.rk{stroke:var(--surface);stroke-width:1;cursor:pointer;transition:fill .25s}
.rk:hover{stroke:var(--ink)}
.rk.f0{fill:var(--f0)}.rk.f1{fill:var(--f1)}.rk.f2{fill:var(--f2)}.rk.f3{fill:var(--f3)}.rk.f4{fill:var(--f4)}
.rk.sel{stroke:var(--accent);stroke-width:3}
.rk.hl{stroke:var(--accent);stroke-width:2.2}
.blk{fill:var(--bad)}
.corr{stroke:var(--mark);stroke-width:1;stroke-dasharray:2 5;fill:none}
.dock{fill:var(--surface2);stroke:var(--line)}
.docklbl{fill:var(--ink);font:600 11px var(--font-ui)}
.gate{fill:var(--ink);opacity:.75}
.gatelbl{fill:var(--muted);font:400 9px var(--font-mono)}
.route{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.routeh{fill:none;stroke:var(--accent-ink);stroke-width:5;opacity:.18}
.stop{fill:var(--accent);stroke:var(--accent-ink);stroke-width:1}
.stopn{fill:var(--accent-ink);font:600 8px var(--font-mono);text-anchor:middle;dominant-baseline:central}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.search{padding:10px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font:600 11px var(--font-mono);background:var(--surface2);border-radius:9px;padding:1px 6px;margin-left:4px}
.body{padding:12px;display:flex;flex-direction:column;gap:12px}
.hint{color:var(--muted);font-size:13px;margin:0}
.addr{font:600 18px var(--font-mono);letter-spacing:.02em}
.sec h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.elev{display:grid;gap:4px}
.cell{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:5px 6px;text-align:left;min-height:62px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .t{font:400 10px var(--font-mono);color:var(--muted)}
.cell .a{font:600 11px var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .n{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.empty .a{color:var(--muted);font-weight:400}
.cell.blocked{border-color:var(--bad);background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,transparent 6px 10px)}
.cell.on{outline:2px solid var(--accent);outline-offset:-1px}
.cell.hl{border-color:var(--accent)}
.bar{height:4px;background:var(--f0);border-radius:2px;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--f3)}
.tierlbl{font:400 10px var(--font-mono);color:var(--muted);align-self:center}
.card{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}
input.num{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;background:var(--surface);border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface2)}
.li.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--accent)}
.li .sub{grid-column:1/-1;color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:600;border-radius:10px;padding:2px 8px;white-space:nowrap;align-self:start}
.pill.wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
table.steps{width:100%;border-collapse:collapse;font-size:12.5px}
table.steps td,table.steps th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.steps th{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
table.steps td.r,table.steps th.r{text-align:right}
.no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 10px var(--font-mono)}
.zstat{display:grid;grid-template-columns:28px 1fr 46px;gap:8px;align-items:center;font-size:12.5px}
.zstat .bar{height:8px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{white-space:nowrap;font:400 11px var(--font-mono);border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:3px 6px}
.chip:hover{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.warnbox{font-size:12.5px;color:var(--bad)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){.rk{transition:none}}
.err{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;max-width:calc(100% - 32px);z-index:9}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Адресный склад запчастей</h1>
    <p>Центральный склад сети · схема хранения по адресам <span class="mono">Зона-Ряд-Стеллаж-Ярус-Ячейка</span></p>
  </div>
  <div class="kpis" id="kpis"></div>
</header>

<div class="grid">
  <section class="mapwrap" aria-label="Схема склада">
    <div class="maphead">
      <h2 id="mapTitle">План склада</h2>
      <div class="legend">
        <span><i style="background:var(--f0)"></i>пусто</span>
        <span><i style="background:var(--f1)"></i>&lt;35%</span>
        <span><i style="background:var(--f2)"></i>&lt;70%</span>
        <span><i style="background:var(--f3)"></i>&lt;95%</span>
        <span><i style="background:var(--f4)"></i>полный</span>
        <span><i style="background:var(--bad);width:6px"></i>блок</span>
      </div>
    </div>
    <svg class="map" id="map" viewBox="0 0 940 580" role="img" aria-label="План склада: зоны A–D, стеллажи, ворота"></svg>
  </section>

  <aside class="panel">
    <div class="search">
      <input id="q" type="search" placeholder="Артикул, название или адрес (A-02-07)" autocomplete="off" aria-label="Поиск">
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="body" id="body"></div>
  </aside>
</div>
<div class="foot">
  <span id="status">Подключение к серверу…</span>
  <span class="row" style="gap:16px"><button class="linkbtn" id="reset" type="button" hidden>Сбросить демо-данные</button><button class="linkbtn" id="logout" type="button">Выйти</button></span>
</div>

<script>
const pad=n=>String(n).padStart(2,'0');
const CX=470,RH=16,RS=34,RECV={x:220,y:448},SHIP={x:716,y:448};
let ZONES=[],SKU={},SKUS=[],RACKS=[],RACK={},META={},S=null,ME='—',IS_ADMIN=false;
const U={tab:'rack',rack:null,cell:null,hl:new Set(),route:null,asn:null,order:null,plan:null,q:'',skuSel:null,busy:false};

/* api */
async function api(path,opt){
  const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'},cache:'no-store'},opt||{}));
  let d=null;try{d=await r.json()}catch(e){}
  if(r.status===401){location.href='/login';throw new Error('Нужно войти')}
  if(!r.ok||(d&&d.ok===false))throw new Error((d&&d.error)||('Ошибка сервера '+r.status));
  return d;
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function newOpId(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function status(msg,bad){const s=document.getElementById('status');s.textContent=msg;s.className=bad?'err':''}

function buildGeometry(){
  RACKS=[];RACK={};META={};
  for(const z of ZONES)for(let r=0;r<z.rows;r++)for(let k=0;k<z.racks;k++){
    const id=`${z.id}-${pad(r+1)}-${pad(k+1)}`,x=z.x+k*(z.rw+2),y=z.y+r*RS;
    const rk={id,zone:z.id,z,r,k,x,y,w:z.rw,cx:x+z.rw/2,ay:y+RH+9,cells:[]};
    for(let t=1;t<=z.tiers;t++)for(let c=1;c<=z.cells;c++){const a=`${id}-${t}-${c}`;rk.cells.push(a);META[a]={rack:id,zone:z.id,tier:t,cell:c}}
    RACKS.push(rk);RACK[id]=rk;
  }
}
function setState(st){S=st;SKUS=st.skus;SKU=Object.fromEntries(SKUS.map(s=>[s.art,s]));document.getElementById('reset').hidden=!(st.demo&&IS_ADMIN)}
function cellOf(a){const c=S.cells[a];return c?{sku:c[0],qty:c[1],blocked:!!c[2]}:{sku:null,qty:0,blocked:false}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function skuName(a){return SKU[a]?SKU[a].name:a}
function rackFill(id){let f=0,b=0;for(const a of RACK[id].cells){const c=cellOf(a);if(c.blocked)b++;if(c.sku&&SKU[c.sku])f+=c.qty/SKU[c.sku].per}return{fill:f/RACK[id].cells.length,blocked:b}}
function fcls(f){return f===0?'f0':f<.35?'f1':f<.7?'f2':f<.95?'f3':'f4'}
function sortRoute(st){return st.sort((p,q)=>{const a=RACK[META[p.addr].rack],b=RACK[META[q.addr].rack];return a.ay-b.ay||a.cx-b.cx||META[p.addr].tier-META[q.addr].tier})}
function routePath(stops,home){
  const pts=[home,{x:CX,y:home.y}];let cur={x:CX,y:home.y};
  for(const s of stops){const rk=RACK[META[s.addr].rack],p={x:rk.cx,y:rk.ay};
    if(Math.abs(cur.y-p.y)>.5)pts.push({x:CX,y:cur.y},{x:CX,y:p.y});pts.push(p);cur=p}
  pts.push({x:CX,y:cur.y},{x:CX,y:home.y},home);
  return pts.map(p=>p.x+','+p.y).join(' ');
}
function fmtTs(ts){const today=new Date();const d=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
  return ts.slice(0,10)===d?ts.slice(11,16):`${ts.slice(8,10)}.${ts.slice(5,7)} ${ts.slice(11,16)}`}

/* map */
const svg=document.getElementById('map');
function drawMap(){
  let h=`<rect class="floor" x="10" y="10" width="920" height="560" rx="6"/>`;
  h+=`<line class="corr" x1="${CX}" y1="40" x2="${CX}" y2="470"/><line class="corr" x1="30" y1="${RECV.y}" x2="910" y2="${RECV.y}"/>`;
  for(const z of ZONES){
    const w=z.racks*(z.rw+2)-2,hgt=(z.rows-1)*RS+RH+18;
    h+=`<rect class="zoneframe" x="${z.x-12}" y="${z.y-8}" width="${w+24}" height="${hgt+8}" rx="4"/>`;
    h+=`<text class="zlabel" x="${z.x-12}" y="${z.y-22}">${esc(z.title)}</text><text class="zsub" x="${z.x+40}" y="${z.y-22}">${esc(z.sub)}</text>`;
    for(let r=0;r<z.rows;r++)h+=`<text class="rowlbl" x="${z.x-4}" y="${z.y+r*RS+11}" text-anchor="end">${pad(r+1)}</text>`;
  }
  for(const rk of RACKS)h+=`<rect class="rk" data-rack="${rk.id}" x="${rk.x}" y="${rk.y}" width="${rk.w}" height="${RH}" rx="2"><title>${rk.id}</title></rect>`;
  h+=`<g id="blk"></g>`;
  h+=`<rect class="dock" x="40" y="462" width="360" height="46" rx="4"/><text class="docklbl" x="52" y="489">Приёмка · буфер размещения</text>`;
  h+=`<rect class="dock" x="540" y="462" width="352" height="46" rx="4"/><text class="docklbl" x="552" y="489">Отгрузка · комплектация заказов</text>`;
  for(let i=0;i<6;i++){const x=70+i*140;h+=`<rect class="gate" x="${x}" y="532" width="60" height="10" rx="2"/><text class="gatelbl" x="${x+30}" y="556" text-anchor="middle">ВОРОТА ${i+1}</text>`}
  h+=`<g id="ov"></g>`;
  svg.innerHTML=h;
}
function paint(){
  let bl='';const hlR=new Set([...U.hl].map(a=>META[a]&&META[a].rack));
  for(const rk of RACKS){
    const el=svg.querySelector(`[data-rack="${rk.id}"]`),{fill,blocked}=rackFill(rk.id);
    el.setAttribute('class',`rk ${fcls(fill)}${U.rack===rk.id?' sel':''}${hlR.has(rk.id)?' hl':''}`);
    el.querySelector('title').textContent=`${rk.id} · заполнено ${Math.round(fill*100)}%${blocked?' · блок: '+blocked:''}`;
    if(blocked)bl+=`<rect class="blk" x="${rk.x+rk.w-5}" y="${rk.y+1}" width="4" height="4"/>`;
  }
  svg.querySelector('#blk').innerHTML=bl;
  let ov='';
  if(U.route&&U.route.stops.length){
    const pts=routePath(U.route.stops,U.route.home);
    ov+=`<polyline class="routeh" points="${pts}"/><polyline class="route" points="${pts}"/>`;
    const seen={};
    U.route.stops.forEach((s,i)=>{const rk=RACK[META[s.addr].rack],d=(seen[rk.id]=(seen[rk.id]||0)+1)-1;
      ov+=`<circle class="stop" cx="${rk.cx+d*9}" cy="${rk.ay}" r="7"/><text class="stopn" x="${rk.cx+d*9}" y="${rk.ay}">${i+1}</text>`});
  }
  svg.querySelector('#ov').innerHTML=ov;
}

/* kpis & tabs */
function kpis(){
  const tot=Object.keys(META).length;let occ=0,blk=0;
  for(const a in S.cells){const c=S.cells[a];if(c[2])blk++;if(c[0])occ++}
  const k=[[tot,'ячеек'],[Math.round(occ/tot*100)+'%','занято ячеек'],[tot-occ-blk,'свободно'],[blk,'заблокировано'],
    [S.receipts.filter(x=>!x.done).length,'к размещению'],[S.orders.filter(x=>!x.done).length,'заказов к сборке']];
  document.getElementById('kpis').innerHTML=k.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
}
function tabs(){
  const t=[['rack','Стеллаж',''],['in','Приёмка',S.receipts.filter(x=>!x.done).length],['out','Отбор',S.orders.filter(x=>!x.done).length],['log','Журнал','']];
  document.getElementById('tabs').innerHTML=t.map(([id,l,c])=>`<button role="tab" data-tab="${id}" aria-selected="${U.tab===id}">${l}${c!==''?`<span class="cnt">${c}</span>`:''}</button>`).join('');
}

/* views */
function searchView(){
  const q=U.q.trim().toLowerCase();
  const res=SKUS.filter(s=>s.art.toLowerCase().includes(q)||s.name.toLowerCase().includes(q)).slice(0,8);
  if(!res.length)return`<div class="sec"><h3>Поиск</h3><p class="hint">Ничего не найдено. Адрес вводите как <span class="mono">B-03-08</span>.</p></div>`;
  return`<div class="sec"><h3>Найдено в каталоге</h3><div class="list">${res.map(s=>{
    const cells=Object.keys(S.cells).filter(a=>S.cells[a][0]===s.art),total=cells.reduce((n,a)=>n+S.cells[a][1],0),open=U.skuSel===s.art;
    return`<button class="li${open?' on':''}" data-sku="${esc(s.art)}"><span>${esc(s.name)}</span><span class="mono">${total} шт</span><span class="sub mono">${esc(s.art)} · зона ${esc(s.zone)} · ${cells.length} яч.</span></button>${open?`<div style="padding:8px 10px" class="chips">${sortRoute(cells.map(a=>({addr:a}))).map(x=>`<button class="chip" data-goto="${x.addr}">${x.addr} · ${S.cells[x.addr][1]}</button>`).join('')}</div>`:''}`}).join('')}</div></div>`;
}
function rackView(){
  if(!U.rack){
    return`<p class="hint">Нажмите на стеллаж на схеме, чтобы увидеть ячейки по ярусам.</p><div class="sec"><h3>Заполненность зон</h3><div style="display:flex;flex-direction:column;gap:8px">${ZONES.map(z=>{
      const rs=RACKS.filter(r=>r.zone===z.id),f=rs.reduce((n,r)=>n+rackFill(r.id).fill,0)/rs.length,cells=rs.reduce((n,r)=>n+r.cells.length,0);
      return`<div class="zstat"><b class="mono">${esc(z.id)}</b><div class="bar"><i style="width:${f*100}%"></i></div><span class="mono" style="text-align:right">${Math.round(f*100)}%</span></div><div class="note" style="margin:-4px 0 0 36px">${esc(z.sub)} · ${rs.length} стеллажей · ${cells} ячеек · ярусов ${z.tiers}</div>`}).join('')}</div></div>
      <div class="sec"><h3>Как читать адрес</h3><p class="hint"><span class="mono">A-02-07-3-1</span>: зона A, ряд 02, стеллаж 07, ярус 3 (снизу вверх), ячейка 1 (слева направо).</p></div>`;
  }
  const rk=RACK[U.rack],z=rk.z,{fill}=rackFill(rk.id);
  let g=`<div class="elev" style="grid-template-columns:22px repeat(${z.cells},minmax(0,1fr))">`;
  for(let t=z.tiers;t>=1;t--){g+=`<span class="tierlbl">${t}</span>`;for(let c=1;c<=z.cells;c++){
    const a=`${rk.id}-${t}-${c}`,x=cellOf(a),s=x.sku&&SKU[x.sku];
    g+=`<button class="cell${x.sku?'':' empty'}${x.blocked?' blocked':''}${U.cell===a?' on':''}${U.hl.has(a)?' hl':''}" data-cell="${a}" aria-label="Ячейка ${a}">
      <span class="t">${t}-${c}</span><span class="a">${x.blocked?'БЛОК':x.sku?esc(x.sku):'свободна'}</span>${s?`<span class="n">${esc(s.name)}</span><div class="bar"><i style="width:${Math.min(100,x.qty/s.per*100)}%"></i></div>`:''}</button>`}}
  g+=`</div>`;
  return`<div class="row" style="justify-content:space-between"><div><div class="addr">${rk.id}</div><div class="note">${esc(z.title)} · ряд ${pad(rk.r+1)} · стеллаж ${pad(rk.k+1)} · заполнено ${Math.round(fill*100)}%</div></div><button class="btn sm" data-act="closerack">Закрыть</button></div>
  <div class="sec"><h3>Фасад стеллажа</h3>${g}</div>${U.cell?cellCard():''}`;
}
function cellCard(){
  const a=U.cell,c=cellOf(a),s=c.sku&&SKU[c.sku],m=META[a];
  return`<div class="card"><div class="row" style="justify-content:space-between"><span class="addr">${a}</span>${c.blocked?'<span class="pill bad">заблокирована</span>':c.sku?'<span class="pill done">занята</span>':'<span class="pill wait">свободна</span>'}</div>
  <dl class="kv"><dt>Ярус / ячейка</dt><dd>${m.tier} / ${m.cell}</dd>
  ${c.sku?`<dt>Артикул</dt><dd class="mono">${esc(c.sku)}</dd><dt>Наименование</dt><dd>${esc(skuName(c.sku))}</dd><dt>Остаток</dt><dd class="mono">${c.qty}${s?' из '+s.per:''} шт</dd>`:`<dt>Назначение</dt><dd>${esc(ZONES.find(z=>z.id===m.zone).sub)}</dd>`}</dl>
  ${c.sku?`<div class="row"><label for="cnt" class="note">Пересчёт, шт</label><input id="cnt" class="num mono" type="number" min="0" max="${s?s.per:''}" value="${c.qty}"><button class="btn sm" data-act="count">Сохранить</button></div>`:''}
  <div class="row"><button class="btn sm" data-act="block">${c.blocked?'Снять блокировку':'Заблокировать ячейку'}</button></div></div>`;
}
function inView(){
  let h=`<div class="sec"><h3>Поставки к размещению</h3>${S.receipts.length?`<div class="list">${S.receipts.map(x=>
    `<button class="li${U.asn===x.id?' on':''}" data-asn="${x.id}" ${x.done?'disabled':''}><span>${esc(skuName(x.art))}</span><span class="pill ${x.done?'done':'wait'}">${x.done?'размещено':'ожидает'}</span><span class="sub mono">${esc(x.doc)}${x.gate?' · ворота '+esc(x.gate):''} · ${esc(x.art)} · ${x.placed?`${x.qty-x.placed} из ${x.qty}`:x.qty} шт${SKU[x.art]?' · зона '+esc(SKU[x.art].zone):''}</span></button>`).join('')}</div>`:'<p class="hint">Поставок нет. Загрузите командой <span class="mono">import-receipt</span>.</p>'}</div>`;
  const p=U.plan&&U.plan.kind==='in'&&U.plan.id===U.asn?U.plan.data:null;
  if(!U.asn||!S.receipts.some(x=>x.id===U.asn&&!x.done))return h+`<p class="hint">Выберите строку поставки: система подберёт адреса по правилам зоны, сначала дозаполняя ячейки с тем же артикулом, затем свободные ближе к воротам.</p>`;
  if(!p)return h+`<p class="hint">Подбираю адреса…</p>`;
  h+=`<div class="sec"><h3>Предложенные адреса · маршрут от приёмки</h3><table class="steps"><thead><tr><th>№</th><th>Адрес</th><th>Ячейка</th><th class="r">Кол-во</th></tr></thead><tbody>${p.plan.map((x,i)=>`<tr><td><span class="no">${i+1}</span></td><td><button class="chip" data-goto="${x.addr}">${x.addr}</button></td><td class="note">${x.fresh?'свободная':'дозаполнение'}</td><td class="r mono">${x.qty}</td></tr>`).join('')}</tbody></table>
  ${p.left?`<p class="warnbox">Не хватает места на ${p.left} шт. Остаток останется в буфере приёмки.</p>`:''}
  <div class="row" style="margin-top:8px"><button class="btn pri" data-act="putaway" ${p.plan.length&&!U.busy?'':'disabled'}>Подтвердить размещение</button></div></div>`;
  return h;
}
function outView(){
  let h=`<div class="sec"><h3>Заказы дилеров</h3>${S.orders.length?`<div class="list">${S.orders.map(o=>`<button class="li${U.order===o.id?' on':''}" data-order="${o.id}" ${o.done?'disabled':''}><span>${esc(o.dealer)}</span><span class="pill ${o.done?'done':'wait'}">${o.done?'собран':o.due?'до '+esc(o.due):'в работе'}</span><span class="sub mono">${esc(o.number)} · ${o.lines.length} строк · ${(()=>{const t=o.lines.reduce((n,l)=>n+l.qty,0),p=o.lines.reduce((n,l)=>n+l.picked,0);return p?`взято ${p} из ${t}`:t+' шт'})()}</span></button>`).join('')}</div>`:'<p class="hint">Заказов нет. Загрузите командой <span class="mono">import-order</span>.</p>'}</div>`;
  const p=U.plan&&U.plan.kind==='out'&&U.plan.id===U.order?U.plan.data:null;
  if(!U.order||!S.orders.some(x=>x.id===U.order&&!x.done))return h+`<p class="hint">Выберите заказ: система построит маршрут отбора от зоны отгрузки и построит маршрут с минимумом точек: по возможности строка берётся из одной ячейки, и в первую очередь из менее полных.</p>`;
  if(!p)return h+`<p class="hint">Строю маршрут…</p>`;
  h+=`<div class="sec"><h3>Лист отбора · ${p.plan.length} точек</h3><table class="steps"><thead><tr><th>№</th><th>Адрес</th><th>Артикул</th><th class="r">Взять</th></tr></thead><tbody>${p.plan.map((x,i)=>`<tr><td><span class="no">${i+1}</span></td><td><button class="chip" data-goto="${x.addr}">${x.addr}</button></td><td><span class="mono">${esc(x.art)}</span><div class="note">${esc(skuName(x.art))}</div></td><td class="r mono">${x.qty}</td></tr>`).join('')}</tbody></table>
  ${p.short.length?`<p class="warnbox">Недостача: ${p.short.map(s=>`${esc(s.art)} — ${s.qty} шт`).join(', ')}</p>`:''}
  <div class="row" style="margin-top:8px"><button class="btn pri" data-act="pick" ${U.busy?'disabled':''}>${p.short.length?'Подтвердить отбор и закрыть с недостачей':'Подтвердить отбор'}</button></div></div>`;
  return h;
}
function logView(){
  return`<div class="sec"><h3>Последние операции</h3><table class="steps"><thead><tr><th>Время</th><th>Операция</th><th>Адрес</th><th class="r">Кол-во</th></tr></thead><tbody>${S.log.map(l=>`<tr><td class="mono">${fmtTs(l.ts)}</td><td>${esc(l.op)}<div class="note">${[l.art?`<span class="mono">${esc(l.art)}</span>`:'',esc(l.ref||''),esc(l.user||'')].filter(Boolean).join(' · ')}</div></td><td>${l.addr&&META[l.addr]?`<button class="chip" data-goto="${l.addr}">${l.addr}</button>`:'<span class="note">—</span>'}</td><td class="r mono">${l.qty==null?'':l.qty>0?'+'+l.qty:l.qty}</td></tr>`).join('')}</tbody></table></div>`;
}
function body(){
  let h=U.q?searchView():'';
  h+=({rack:rackView,in:inView,out:outView,log:logView})[U.tab]();
  document.getElementById('body').innerHTML=h;
}
function derive(){
  U.route=null;const hl=new Set();
  const p=U.plan&&((U.tab==='in'&&U.plan.kind==='in'&&U.plan.id===U.asn)||(U.tab==='out'&&U.plan.kind==='out'&&U.plan.id===U.order))?U.plan:null;
  if(p){U.route={stops:p.data.plan,home:p.kind==='in'?RECV:SHIP};p.data.plan.forEach(x=>hl.add(x.addr))}
  if(U.skuSel)for(const a in S.cells)if(S.cells[a][0]===U.skuSel)hl.add(a);
  U.hl=hl;
  document.getElementById('mapTitle').textContent=U.route?(U.tab==='in'?'Маршрут размещения':'Маршрут отбора'):U.skuSel?'Ячейки артикула '+U.skuSel:'План склада';
}
function render(){derive();kpis();tabs();body();paint()}

async function loadPlan(){
  const kind=U.tab==='in'?'in':'out',id=kind==='in'?U.asn:U.order;
  if(!id)return;
  try{const data=await api(`/api/plan/${kind==='in'?'putaway':'pick'}/${id}`);U.plan={kind,id,data}}
  catch(e){U.plan=null;toast(e.message)}
  render();
}
async function act(path,payload,okMsg){
  if(U.busy)return;U.busy=true;
  try{const r=await api(path+'?state=1',{method:'POST',headers:{'Content-Type':'application/json','X-Op-Id':newOpId()},body:JSON.stringify(payload||{})});setState(r.state);if(okMsg)toast(okMsg)}
  catch(e){toast(e.message)}
  U.busy=false;U.plan=null;render();
  if((U.tab==='in'&&U.asn&&S.receipts.some(x=>x.id===U.asn&&!x.done))||(U.tab==='out'&&U.order&&S.orders.some(x=>x.id===U.order&&!x.done)))loadPlan();
}

/* events */
svg.addEventListener('click',e=>{const r=e.target.closest('[data-rack]');if(!r)return;U.rack=r.dataset.rack;U.cell=null;U.tab='rack';render()});
document.getElementById('tabs').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return;U.tab=t.dataset.tab;render();if((U.tab==='in'&&U.asn)||(U.tab==='out'&&U.order))loadPlan()});
document.getElementById('body').addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]'),c=e.target.closest('[data-cell]'),k=e.target.closest('[data-sku]'),
    a=e.target.closest('[data-asn]'),o=e.target.closest('[data-order]'),b=e.target.closest('[data-act]');
  if(g){const m=META[g.dataset.goto];if(m){U.rack=m.rack;U.cell=g.dataset.goto;U.tab='rack';render()}return}
  if(c){U.cell=c.dataset.cell;render();return}
  if(k){U.skuSel=U.skuSel===k.dataset.sku?null:k.dataset.sku;render();return}
  if(a){U.asn=+a.dataset.asn;U.plan=null;render();loadPlan();return}
  if(o){U.order=+o.dataset.order;U.plan=null;render();loadPlan();return}
  if(!b)return;
  const A=b.dataset.act;
  if(A==='closerack'){U.rack=null;U.cell=null;render()}
  if(A==='block')act(`/api/cells/${U.cell}/block`,{blocked:!cellOf(U.cell).blocked},cellOf(U.cell).blocked?'Блокировка снята':'Ячейка заблокирована');
  if(A==='count')act(`/api/cells/${U.cell}/count`,{qty:parseInt(document.getElementById('cnt').value,10)},'Пересчёт сохранён');
  if(A==='putaway')act(`/api/receipts/${U.asn}/putaway`,null,'Размещение проведено');
  if(A==='pick')act(`/api/orders/${U.order}/pick`,null,'Отбор проведён');
});
const qi=document.getElementById('q');
qi.addEventListener('input',()=>{
  const v=qi.value.trim(),m=v.toUpperCase().match(/^([A-Z0-9]+)-?(\d{1,2})-?(\d{1,2})(?:-?(\d)-?(\d))?$/);
  if(m){const id=`${m[1]}-${pad(m[2])}-${pad(m[3])}`;if(RACK[id]){U.rack=id;U.cell=m[4]?`${id}-${m[4]}-${m[5]}`:null;if(U.cell&&!META[U.cell])U.cell=null;U.tab='rack';U.q='';U.skuSel=null;render();return}}
  U.q=v;if(!v)U.skuSel=null;render();
});
document.getElementById('reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Нажмите ещё раз — все данные заменятся демо';setTimeout(()=>{b.dataset.confirm='';b.textContent='Сбросить демо-данные'},4000);return}
  b.dataset.confirm='';b.textContent='Сбросить демо-данные';
  Object.assign(U,{rack:null,cell:null,asn:null,order:null,plan:null,skuSel:null,q:''});qi.value='';
  act('/api/demo/reset',null,'Демо-данные восстановлены');
});

document.getElementById('logout').addEventListener('click',async()=>{try{await fetch('/api/logout',{method:'POST'})}catch(e){}location.href='/login'});

/* live refresh: other operators' changes appear without reload */
async function poll(){
  try{
    const {rev}=await api('/api/rev');
    status(`Сервер на связи · ${ME} · обновлено ${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}`);
    const typing=document.activeElement&&document.activeElement.id==='cnt';
    if(rev!==S.rev&&!U.busy&&!typing){setState(await api('/api/state'));render();if(U.plan)loadPlan()}
  }catch(e){status('Нет связи с сервером — изменения не сохранятся, пока связь не восстановится',true)}
}
(async function boot(){
  try{
    const lay=await api('/api/layout');ZONES=lay.zones;buildGeometry();
    const st=await api('/api/state');ME=st.user.username;IS_ADMIN=st.user.role==='admin';setState(st);drawMap();render();poll();setInterval(poll,8000);
  }catch(e){status('Не удалось загрузить данные: '+e.message,true)}
})();
</script>
</body>
</html>
