<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вход · WarehouseOS</title>
<meta name="theme-color" content="#ECEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181B" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<style>
/* Слева фото здания склада, справа панель входа. Шрифты системные: SF Pro / New York на Mac и iPhone,
   Segoe UI / Georgia на Windows — ничего не грузится из интернета. */
:root{
  --bg:#ECEEF0; --surface:#FBFBFC; --ink:#1D1D1F; --muted:#6E6E73; --line:rgba(60,60,67,.18);
  --accent:#0A798D; --accent-hover:#086879; --accent-ink:#FFFFFF; --bad:#C2412D; --warn:#B5651D;
  --brand-teal:#0E8FA3; --brand-red:#D41031; --charcoal:#292E30; --fill:rgba(118,118,128,.12);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:ui-serif,"New York","NewYork",-apple-system-ui-serif,"Iowan Old Style",Charter,Georgia,"Times New Roman",serif;
  --font-brand:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI Variable Display","Segoe UI",Roboto,Arial,sans-serif;
  --ring:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181B; --surface:#1C1F22; --ink:#F2F2F7; --muted:#98989F; --line:rgba(84,84,88,.6);
  --accent:#2FAFC2; --accent-hover:#47BED0; --accent-ink:#0B1417; --bad:#EE7461; --warn:#E39A52;
  --charcoal:#F2F2F7; --brand-red:#EF3B55; --fill:rgba(118,118,128,.24); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181B; --surface:#1C1F22; --ink:#F2F2F7; --muted:#98989F; --line:rgba(84,84,88,.6);
  --accent:#2FAFC2; --accent-hover:#47BED0; --accent-ink:#0B1417; --bad:#EE7461; --warn:#E39A52;
  --charcoal:#F2F2F7; --brand-red:#EF3B55; --fill:rgba(118,118,128,.24); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;letter-spacing:-.003em;
  display:grid;grid-template-columns:minmax(0,1.35fr) minmax(380px,1fr)}
.photo{position:relative;background:#24292C center 45%/cover no-repeat;min-height:100%}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.62))}
.caption{position:absolute;left:40px;right:40px;bottom:36px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:6px}
.caption .os{font:600 12px var(--font-ui);letter-spacing:.02em;color:#9FE3EE}
.caption b{font:600 34px/1.1 var(--font-display);letter-spacing:-.015em;text-wrap:balance;max-width:22ch}
.caption span{font-size:15px;color:rgba(255,255,255,.82)}
.panel{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:48px clamp(24px,5vw,72px);gap:28px;background:var(--bg)}
.wordmark{display:flex;align-items:center;gap:12px;min-height:30px}
.wordmark img{max-height:52px;max-width:100%}
.wordmark .l1{font:800 19px/1 var(--font-brand);color:var(--brand-red);letter-spacing:-.01em}
.wordmark .bar{width:2px;height:22px;background:var(--charcoal);opacity:.8;border-radius:2px;flex:none}
.wordmark.has-logo{background:#E6E3E0;padding:10px 14px;border-radius:10px}
.wordmark .l2{font:500 16px/1 var(--font-brand);letter-spacing:.32em;color:var(--charcoal)}
.head h1{margin:0;font:600 34px/1.1 var(--font-display);letter-spacing:-.015em}
.head p{margin:8px 0 0;color:var(--muted);font-size:15px}
form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
/* сгруппированные поля, как в настройках iOS */
.group{background:var(--surface);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 .5px rgba(0,0,0,.06);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:50px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--line)}
.row label{width:72px;flex:none;font-size:15px;color:var(--ink)}
.row input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:14px 0;outline:none}
.row input::placeholder{color:var(--muted);opacity:.8}
.row:focus-within{box-shadow:inset 3px 0 0 var(--accent)}
.row input:focus-visible{box-shadow:none}
.eye{border:0;background:none;color:var(--accent);font:500 14px var(--font-ui);padding:6px 2px;cursor:pointer;flex:none}
.eye:hover{color:var(--accent-hover)}
.btn{min-height:50px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--font-ui);cursor:pointer;
  transition:background .15s,transform .05s}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:none;box-shadow:var(--ring)}
.msg{font-size:13.5px;min-height:1.3em;margin:-4px 2px 0}
#err{color:var(--bad)}
#caps{color:var(--warn)}
.foot{font-size:13px;color:var(--muted);margin:0;max-width:400px}
.brandline{height:2px;width:100%;max-width:400px;background:linear-gradient(90deg,var(--brand-teal) 0 78%,var(--brand-red) 78% 100%);border-radius:2px}
@media (max-width:820px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .photo{min-height:30vh}
  .caption{left:16px;right:16px;bottom:16px}
  .caption b{font-size:24px}
  .panel{justify-content:flex-start;padding:24px 16px calc(32px + env(safe-area-inset-bottom,0px));gap:22px}
  .head h1{font-size:30px}
}
</style>
</head>
<body>
<div class="photo" id="photo" role="img" aria-label="Здание склада">
  <div class="caption"><span class="os">WarehouseOS</span><b id="wn">Адресный склад запчастей</b><span id="ws"></span></div>
</div>
<main class="panel">
  <div class="wordmark" id="wordmark"></div>
  <div class="head"><h1>Вход</h1><p>Логин и пароль выдаёт администратор склада</p></div>
  <form id="f" autocomplete="on" novalidate>
    <div class="group">
      <div class="row"><label for="u">Логин</label><input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="например, ivanov" required autofocus></div>
      <div class="row"><label for="p">Пароль</label><input id="p" name="password" type="password" autocomplete="current-password" placeholder="обязательно" required><button type="button" class="eye" id="eye" aria-pressed="false">Показать</button></div>
    </div>
    <div class="msg" role="alert"><span id="err"></span><span id="caps" hidden>Включён Caps Lock</span></div>
    <button class="btn" id="b" type="submit">Войти</button>
  </form>
  <div class="brandline"></div>
  <p class="foot">Адресное хранение, приёмка, отбор, инвентаризация и отчёты</p>
</main>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.getElementById('photo').style.backgroundImage = 'url("/brand/photo")';
fetch('/api/public').then((r) => r.json()).then((d) => {
  document.getElementById('wn').textContent = d.name;
  document.getElementById('ws').textContent = d.subtitle || '';
  document.title = 'Вход · ' + d.name;
  document.getElementById('photo').style.backgroundImage = `url("/brand/photo?v=${encodeURIComponent(d.v)}")`;
  const wm = document.getElementById('wordmark');
  wm.classList.toggle('has-logo', !!d.hasLogo);
  wm.innerHTML = d.hasLogo ? `<img src="/brand/logo?v=${encodeURIComponent(d.v)}" alt="${esc(d.line1 || 'Логотип')}">`
    : `${d.line1 ? `<span class="l1">${esc(d.line1)}</span>` : ''}${d.line1 && d.line2 ? '<span class="bar"></span>' : ''}${d.line2 ? `<span class="l2">${esc(d.line2)}</span>` : ''}`;
}).catch(() => {});
const pw = document.getElementById('p'), eye = document.getElementById('eye'), caps = document.getElementById('caps');
eye.onclick = () => { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; eye.textContent = show ? 'Скрыть' : 'Показать'; eye.setAttribute('aria-pressed', String(show)); pw.focus(); };
const capsCheck = (e) => { if (e.getModifierState) caps.hidden = !e.getModifierState('CapsLock'); };
pw.addEventListener('keydown', capsCheck); pw.addEventListener('keyup', capsCheck); pw.addEventListener('blur', () => { caps.hidden = true; });
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  const u = document.getElementById('u');
  if (!u.value.trim()) { err.textContent = 'Введите логин'; u.focus(); return; }
  if (!pw.value) { err.textContent = 'Введите пароль'; pw.focus(); return; }
  b.disabled = true; b.textContent = 'Входим…'; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u.value.trim(), password: pw.value }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    err.textContent = d.error || 'Не удалось войти';
    pw.select();
  } catch (x) { err.textContent = 'Нет связи с сервером'; }
  b.disabled = false; b.textContent = 'Войти';
});
</script>
</body>
</html>
