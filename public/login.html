<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вход · WarehouseOS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#E9ECEC;--surface:#F7F8F8;--ink:#1A2227;--muted:#5A666D;--line:#D0D6D8;--accent:#F2B705;--accent-ink:#1A2227;--bad:#C2412D;--mark:#C99A06;
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#11161A;--surface:#182026;--ink:#E3E8EA;--muted:#8E9AA1;--line:#2B353C;--accent:#F5C02B;--accent-ink:#11161A;--bad:#EE7461;--mark:#8C6E14;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-ui);display:grid;place-items:center;padding-inline:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px;
  background-image:repeating-linear-gradient(135deg,var(--accent) 0 10px,var(--accent-ink) 10px 20px);background-size:100% 6px;background-repeat:no-repeat}
h1{margin:2px 0 0;font-size:20px}
.os{font:600 11px var(--font-mono);letter-spacing:.14em;color:var(--mark);text-transform:uppercase}
p{margin:0;color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{padding:11px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--font-ui);cursor:pointer}
button:disabled{opacity:.5}
#err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div><span class="os">WarehouseOS</span><h1 id="wn">Адресный склад запчастей</h1><p id="ws">Центральный склад сети</p></div>
  <label for="u">Логин<input id="u" name="username" autocomplete="username" required autofocus></label>
  <label for="p">Пароль<input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <div id="err" role="alert"></div>
  <button id="b" type="submit">Войти</button>
</form>
<script>
fetch('/api/public').then((r) => r.json()).then((d) => {
  document.getElementById('wn').textContent = d.name; document.getElementById('ws').textContent = d.subtitle || '';
  document.title = 'Вход · ' + d.name;
}).catch(() => {});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('b'),err=document.getElementById('err');
  b.disabled=true;err.textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){location.href='/';return}
    err.textContent=d.error||'Не удалось войти';
  }catch(x){err.textContent='Нет связи с сервером'}
  b.disabled=false;
});
</script>
</body>
</html>
