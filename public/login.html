<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вход · WarehouseOS</title>
<meta name="theme-color" content="#24292C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Michroma&display=swap">
<style>
/* Слева фото здания склада, справа светлая «фасадная» панель с вывеской и формой входа */
:root{
  --bg:#ECEEF0; --surface:#FBFBFC; --ink:#20262A; --muted:#5D666D; --line:#D6DADE;
  --accent:#0A798D; --accent-hover:#086879; --accent-ink:#FFFFFF; --bad:#C2412D;
  --brand-teal:#0E8FA3; --brand-red:#D41031; --facade:#E6E3E0; --facade-line:#D7D3CF; --charcoal:#292E30;
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-brand:"Michroma","Eurostile","Onest",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181B; --surface:#1B2024; --ink:#E5E9EC; --muted:#96A1A8; --line:#30383E;
  --accent:#2FAFC2; --accent-hover:#47BED0; --accent-ink:#0B1417; --bad:#EE7461;
  --facade:#1B2024; --facade-line:#22282D; --charcoal:#E5E9EC; --brand-red:#EF3B55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181B; --surface:#1B2024; --ink:#E5E9EC; --muted:#96A1A8; --line:#30383E;
  --accent:#2FAFC2; --accent-hover:#47BED0; --accent-ink:#0B1417; --bad:#EE7461;
  --facade:#1B2024; --facade-line:#22282D; --charcoal:#E5E9EC; --brand-red:#EF3B55; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-ui);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr)}
.photo{position:relative;background:#24292C center 45%/cover no-repeat;min-height:100%}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,24,27,0) 45%,rgba(20,24,27,.72))}
.caption{position:absolute;left:32px;right:32px;bottom:28px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:6px}
.caption .os{font:600 11px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;color:#8FD8E3}
.caption b{font-size:22px;font-weight:600;text-wrap:balance;max-width:28ch}
.caption span{font-size:14px;color:#D5DCE0}
.panel{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(24px,5vw,64px);gap:28px;background:var(--facade);
  background-image:repeating-linear-gradient(180deg,transparent 0 47px,var(--facade-line) 47px 48px)}
.wordmark{display:flex;align-items:center;gap:12px;min-height:32px}
.wordmark img{max-height:56px;max-width:100%}
.wordmark .l1{font:400 18px/1 var(--font-brand);color:var(--brand-red)}
.wordmark .bar{width:3px;height:24px;background:var(--charcoal);border-radius:2px;flex:none}
.wordmark.has-logo{background:#E6E3E0;padding:10px 14px;border-radius:8px}
.wordmark .l2{font:400 16px/1 var(--font-brand);letter-spacing:.26em;color:var(--charcoal)}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 12px 32px rgba(32,38,42,.10);border-top:4px solid var(--brand-teal)}
h1{margin:0;font-size:20px}
p{margin:0;color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{padding:11px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--font-ui);cursor:pointer}
button:hover{background:var(--accent-hover)}
button:disabled{opacity:.5}
#err{color:var(--bad);font-size:13px;min-height:1.2em}
.foot{font-size:12px;color:var(--muted)}
.brandline{height:3px;width:100%;max-width:380px;background:linear-gradient(90deg,var(--brand-teal) 0 78%,var(--brand-red) 78% 100%);border-radius:2px}
@media (max-width:820px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .photo{min-height:34vh}
  .caption{left:16px;right:16px;bottom:16px}
  .caption b{font-size:18px}
  .panel{justify-content:flex-start;padding:24px 16px 32px}
}
</style>
</head>
<body>
<div class="photo" id="photo" role="img" aria-label="Здание склада">
  <div class="caption"><span class="os">WarehouseOS</span><b id="wn">Адресный склад запчастей</b><span id="ws"></span></div>
</div>
<main class="panel">
  <div class="wordmark" id="wordmark"></div>
  <form id="f" autocomplete="on">
    <div><h1>Вход в систему</h1><p>Логин и пароль выдаёт администратор склада</p></div>
    <label for="u">Логин<input id="u" name="username" autocomplete="username" required autofocus></label>
    <label for="p">Пароль<input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <div id="err" role="alert"></div>
    <button id="b" type="submit">Войти</button>
  </form>
  <div class="brandline"></div>
  <p class="foot">Адресное хранение, приёмка, отбор, инвентаризация, отчёты</p>
</main>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
document.getElementById('photo').style.backgroundImage = 'url("/brand/photo")';
fetch('/api/public').then((r) => r.json()).then((d) => {
  document.getElementById('wn').textContent = d.name;
  document.getElementById('ws').textContent = d.subtitle || '';
  document.title = 'Вход · ' + d.name;
  document.getElementById('photo').style.backgroundImage = `url("/brand/photo?v=${encodeURIComponent(d.v)}")`;
  const wm = document.getElementById('wordmark');
  wm.classList.toggle('has-logo', !!d.hasLogo);
  wm.innerHTML = d.hasLogo ? `<img src="/brand/logo?v=${encodeURIComponent(d.v)}" alt="${esc(d.line1 || 'Логотип')}">`
    : `${d.line1 ? `<span class="l1">${esc(d.line1)}</span>` : ''}${d.line1 && d.line2 ? '<span class="bar"></span>' : ''}${d.line2 ? `<span class="l2">${esc(d.line2)}</span>` : ''}`;
}).catch(() => {});
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = '/'; return; }
    err.textContent = d.error || 'Не удалось войти';
  } catch (x) { err.textContent = 'Нет связи с сервером'; }
  b.disabled = false;
});
</script>
</body>
</html>
